<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eve & Lilly Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h2>Eve & Lilly Scanner Demo</h2>

  <button onclick="startScanner()">Start Scanner</button>

  <div id="reader"></div>

  <div id="result">
    Waiting for barcode...
  </div>

  <script>
    let scanner;

    function startScanner() {

      scanner = new Html5Qrcode("reader");

      Html5Qrcode.getCameras()
        .then(cameras => {

          if (!cameras || cameras.length === 0) {
            document.getElementById("result").innerHTML =
              "No camera found.";
            return;
          }

          const cameraId = cameras[cameras.length - 1].id;

          scanner.start(
            cameraId,
            {
              fps: 10,
              qrbox: {
                width: 280,
                height: 120
              }
            },
            onScanSuccess
          );

        })
        .catch(error => {
          document.getElementById("result").innerHTML =
            "Camera error: " + error;
        });
    }

    async function onScanSuccess(decodedText) {

  scanner.stop();

  document.getElementById("result").innerHTML =
    "Looking up product...";

  const backendUrl =
    "https://script.google.com/macros/s/AKfycbwdyg1xMB1UJWdCAe8jJrlKYLd5RnmLF8NzUgKiGhU4szU1g8EdNmTww7c-hLB1Xd0p7A/exec";

  const response = await fetch(
    backendUrl +
    "?action=product&sku=" +
    encodeURIComponent(decodedText)
  );

  const product = await response.json();

  if (product.found) {

    document.getElementById("result").innerHTML =
      "<h3>" + product.category + "</h3>" +
      "<p><strong>SKU:</strong> " + product.sku + "</p>" +
      "<p><strong>Price:</strong> ₹" + product.price + "</p>" +
      "<p><strong>Current Stock:</strong> " + product.currentStock + "</p>" +
      "<button onclick='addToBill(\"" + product.sku + "\")'>ADD TO BILL</button>" +
      "<button onclick='cancelProduct()'>CANCEL</button>";

  } else {

    document.getElementById("result").innerHTML =
      "Product not found.";
  }
}

function addToBill(sku) {
  alert("Add to Bill will be connected next. SKU: " + sku);
}

function cancelProduct() {
  document.getElementById("result").innerHTML =
    "Waiting for barcode...";
}
  </script>

</body>
</html>
